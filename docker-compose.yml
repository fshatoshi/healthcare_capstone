# Orchestration locale de HealthTrack AI.
# Lancer depuis la racine du projet :   docker compose up -d --build
# Les identifiants viennent du fichier .env (voir .env.example).

services:
  mongodb:
    image: mongo:7.0
    container_name: healthtrack-mongo
    restart: unless-stopped
    # V07 (sécurité) : port NON publié sur l'hôte. La base n'est joignable que
    # par les autres conteneurs via le réseau interne Docker. Pour un accès local
    # ponctuel (mongosh, Compass), décommenter en le liant à la loopback :
    # ports:
    #   - "127.0.0.1:27017:27017"
    volumes:
      - ./infra/mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-healthtrackdb}

  redis:
    image: redis:7.2-alpine
    container_name: healthtrack-redis
    restart: unless-stopped
    # V07 : port interne uniquement (pas d'exposition sur l'hôte).
    command: redis-server --requirepass ${REDIS_PASS}

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: healthtrack-minio
    restart: unless-stopped
    # V07 : l'API S3 (9000) reste interne (utilisée par le backend via le réseau
    # Docker). Seule la console d'admin est exposée, et uniquement sur la loopback.
    ports:
      - "127.0.0.1:9001:9001"   # Console web : http://localhost:9001
    volumes:
      - ./infra/minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./server
    container_name: healthtrack-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8080}:8080"   # port hote configurable via BACKEND_PORT (.env)
    env_file: .env
    environment:
      PORT: 8080
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      MINIO_URL: http://minio:9000
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - mongodb
      - redis
      - minio

  # Le service IA n'est pas encore implémenté : il n'est lancé qu'à la demande,
  # avec  docker compose --profile ai up -d
  # En son absence, le backend renvoie une analyse de repli.
  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
    container_name: healthtrack-ai
    restart: unless-stopped
    # V07 : appelé par le backend via le réseau Docker ; exposé seulement en local.
    ports:
      - "127.0.0.1:8001:8001"
