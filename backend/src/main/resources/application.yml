server:
  port: 8080

spring:
  data:
    mongodb:
      # Connexion avec l'utilisateur 'one' et le mot de passe 'pc'
      uri: mongodb://one:pc@localhost:27017/healthtrackdb?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: pc
  
  # Configuration pour l'upload de fichiers (MinIO) via Spring
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # Attention : Mets une vraie clé longue ici plus tard (ex: générée en Base64)
  secret: mon_super_secret_de_sante_healthtrack_ai_2026
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

ai-service:
  base-url: http://localhost:8001

minio:
  endpoint: http://localhost:9000
  access-key: one
  secret-key: pc
  bucket: healthtrack-files

logging:
  level:
    root: INFO
    com.healthtrack: DEBUG
    org.springframework.data.mongodb: DEBUG
