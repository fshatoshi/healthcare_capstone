# Configuration du backend HealthTrack.
# Les secrets ne sont PAS écrits ici : ils viennent des variables d'environnement
# (fichier .env à la racine, chargé par docker-compose). Voir .env.example.

spring:
  application:
    name: healthtrack-api

  data:
    mongodb:
      host: ${MONGO_HOST:mongodb}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:healthtrackdb}
      username: ${MONGO_USER}
      password: ${MONGO_PASS}
      authentication-database: admin

    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  url: ${MINIO_URL:http://minio:9000}
  accessKey: ${MINIO_USER}
  secretKey: ${MINIO_PASS}
  bucket: ${MINIO_BUCKET:healthtrack-docs}

ai-service:
  url: ${AI_SERVICE_URL:http://ai-service:8001}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    com.healthtrack.api: ${LOG_LEVEL_APP:DEBUG}
