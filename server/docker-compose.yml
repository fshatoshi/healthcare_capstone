services:

  mongodb:
    image: mongo:7.0
    container_name: healthtrack-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./infra/mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: healthtrack
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: healthtrackdb

  redis:
    image: redis:7.2-alpine
    container_name: healthtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass changeme

  minio:
    image: minio/minio:latest
    container_name: healthtrack-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infra/minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme
    command: server /data --console-address ":9001"

  # J'ai mis le service IA en optionnel (image par défaut) pour ne pas bloquer le backend
  ai-service:
    image: python:3.11-slim
    container_name: healthtrack-ai
    restart: unless-stopped
    command: tail -f /dev/null 

  backend:
    build: .
    container_name: healthtrack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    depends_on:
      - mongodb
      - redis
