spring:
  application:
    name: healthtrack-api
  
  data:
    mongodb:
      host: mongodb
      port: 27017
      database: healthtrackdb
      username: healthtrack
      password: changeme
      authentication-database: admin
    
    redis:
      host: redis
      port: 6379
      password: changeme

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuration MinIO (Doublée pour correspondre à tous les noms possibles dans le code)
minio:
  url: http://minio:9000
  endpoint: http://minio:9000
  accessKey: minioadmin
  secretKey: changeme
  bucket: healthtrack-docs

# Configuration Service IA
ai-service:
  url: http://ai-service:8001
  endpoint: http://ai-service:8001

server:
  port: ${PORT:5000}
  forward-headers-strategy: native

